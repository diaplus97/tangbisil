#:schema node_modules/wrangler/config-schema.json
# Cloudflare Pages 설정
#
# ⚠️ 이 파일이 존재하면 Cloudflare 대시보드의 "Functions" 설정
#    (compatibility flags, KV/D1 등 바인딩)은 **무시됩니다**.
#    바인딩은 대시보드가 아니라 반드시 이 파일에 적어야 합니다.

# Cloudflare Pages 프로젝트명과 일치해야 한다 (배포 주소 tangbisil-7h3.pages.dev).
# Git 연동 빌드는 대시보드의 프로젝트를 쓰므로 어긋나도 넘어가지만,
# wrangler pages deploy 를 직접 쓸 때는 이 이름으로 프로젝트를 찾는다.
name = "tangbisil-7h3"
pages_build_output_dir = "dist"

compatibility_date = "2026-08-12"

# ⚠️ 필수 — 빼면 흡연실 NPC 가 런타임에 죽습니다.
#
# @anthropic-ai/sdk 는 자격증명 체인(OAuth 프로필, identity token 파일)을 위해
# node:fs / node:path 를 정적 import 합니다. 우리는 apiKey 를 직접 넘기므로
# 그 코드 경로는 실행되지 않지만, import 자체는 번들에 포함되기 때문에
# 이 플래그가 없으면 모듈 평가 단계에서 터집니다.
compatibility_flags = ["nodejs_compat"]

# ─── 일일 예산 차단기용 KV ────────────────────────────────────
#
# 하루 누적 사용액이 DAILY_BUDGET_USD 를 넘으면 NPC 가 등장하지 않는다.
# /api/chat 은 인증 없는 공개 엔드포인트라, 클라이언트측 제한(담배 갑·턴 수)은
# 우회가 쉽다. 서버측 유일한 방어선이므로 이 바인딩을 지우면 안 된다.
#
# 이 블록은 Production 에 적용된다. Preview 는 ANTHROPIC_API_KEY 가 없어
# 503 으로 떨어지므로 비용이 발생하지 않는다.
[[kv_namespaces]]
binding = "BUDGET_KV"
id = "9946a364b8fb4f358a61bb3668e65b86"

# ─── 시크릿 ───────────────────────────────────────────────────
# ANTHROPIC_API_KEY 는 이 파일에 절대 넣지 마세요 (git 에 올라갑니다).
#   로컬 → .dev.vars
#   배포 → Cloudflare Pages → Settings → Environment variables (Secret 로 등록)
#
# 모델 선택 같은 비밀 아닌 값은 여기 둬도 됩니다:
# [vars]
# NPC_MODEL = "claude-sonnet-5"
# NPC_SUMMARY_MODEL = "claude-haiku-4-5"
# DAILY_BUDGET_USD = "5"
